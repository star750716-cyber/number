<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲端號碼牌系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .view-hidden { display: none !important; }
        
        .ticket-divider { position: relative; }
        .ticket-divider::before, .ticket-divider::after {
            content: ''; position: absolute; top: 50%; width: 24px; height: 24px;
            background-color: #f3f4f6; border-radius: 50%;
            transform: translateY(-50%); box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }
        .ticket-divider::before { left: -12px; }
        .ticket-divider::after { right: -12px; }

        .stamp {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg) scale(0);
            border: 4px solid #ef4444; color: #ef4444;
            font-size: 2rem; font-weight: 900; padding: 0.5rem 2rem;
            border-radius: 0.5rem; opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 10;
        }
        .stamp.show { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.9; }

        .bg-gradient-animate {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .blink-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>

    <script>
        function showGlobalError(title, detail) {
            const spinner = document.getElementById('loading-spinner');
            const text = document.getElementById('loading-text');
            if(spinner) spinner.style.display = 'none';
            if(text) {
                text.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-lg border border-red-100 max-w-sm mx-auto mt-4 text-left">
                        <div class="flex items-center text-red-500 mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                            <span class="font-bold text-lg">${title}</span>
                        </div>
                        <p class="text-xs text-gray-500 break-words mb-4">${detail}</p>
                        <button onclick="window.location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-lg text-sm font-bold hover:bg-red-100 active:scale-95 transition-all">重新整理網頁</button>
                    </div>`;
            }
        }

        window.addEventListener('error', function(event) {
            showGlobalError('程式碼執行錯誤', `${event.message}<br><br>這可能是某些套件被瀏覽器阻擋，請確認網路環境或關閉廣告阻擋器。`);
        });

        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.code === 'auth/unauthorized-domain') {
                showGlobalError("🚫 網域未授權 (Firebase 阻擋)", 
                    `Firebase 拒絕了來自 GitHub Pages 的連線。<br><br>
                    <b>【解決方案】：</b><br>
                    1. 進入 Firebase 控制台 > Authentication (驗證) > Settings (設定) > 授權網域。<br>
                    2. 點擊「新增網域」。<br>
                    3. 輸入：<br><b class="text-blue-600 font-mono bg-blue-50 px-1 py-0.5 rounded">star750716-cyber.github.io</b><br>
                    4. 儲存後，等待 1 分鐘，然後點擊下方重新整理。`);
            } else {
                showGlobalError('資料庫連線失敗', `原因：${event.reason}<br><br>👉 請至 Firebase 控制台確認：<br>1. 是否已開啟 Authentication 的「匿名登入 (Anonymous)」。<br>2. Firestore Rules 是否設定為 allow read, write: if true;`);
            }
        });
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <div id="global-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-300" id="modal-container">
            <div id="modal-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">標題</h3>
            <p id="modal-desc" class="text-gray-500 text-sm mb-6">內容描述</p>
            <div id="modal-buttons" class="flex space-x-3">
                <button id="modal-btn-cancel" class="flex-1 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 active:bg-gray-200 transition-colors hidden">取消</button>
                <button id="modal-btn-confirm" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-500 active:bg-blue-600 shadow-md transition-colors">確定</button>
            </div>
        </div>
    </div>

    <div id="loading-view" class="w-full max-w-sm text-center">
        <div id="loading-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
        <div id="loading-text" class="text-gray-600 font-medium">系統連線中，請稍候...</div>
        
        <div id="invalid-box" class="hidden bg-white p-8 rounded-2xl shadow-lg mt-4 animate-[fadeIn_0.5s_ease-out]">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">無效的連結</h2>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">此連結無法使用或已被分享。<br>請親自至現場櫃台掃描 QR Code 取號。</p>
        </div>
    </div>

    <div id="admin-view" class="w-full max-w-md bg-gray-900 rounded-2xl shadow-2xl overflow-hidden view-hidden border border-gray-700">
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-white font-bold text-lg flex items-center">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse mr-2"></span>
                發號主控台
            </h1>
            <span id="admin-date" class="text-gray-400 text-sm font-mono">--/--/--</span>
        </div>
        
        <div class="p-6 text-center">
            <p class="text-gray-400 text-sm mb-4">請讓顧客掃描此 QR Code 取號</p>
            <div class="bg-white p-4 rounded-xl inline-block mb-6 shadow-[0_0_15px_rgba(255,255,255,0.15)]">
                <div id="qrcode" class="w-48 h-48 flex items-center justify-center">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">今日已發出</p>
                    <p class="text-3xl font-bold text-blue-400" id="admin-issued">0</p>
                </div>
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">已兌換數量</p>
                    <p class="text-3xl font-bold text-green-400" id="admin-redeemed">0</p>
                </div>
            </div>

            <button onclick="confirmReset()" class="w-full py-3 rounded-xl text-sm font-bold text-red-400 bg-red-400/10 border border-red-400/30 hover:bg-red-400/20 active:scale-95 transition-all">
                ⚠️ 清除今日所有號碼 (重新發放)
            </button>
        </div>
    </div>

    <div id="ticket-container-view" class="w-full flex flex-col items-center view-hidden pb-8 pt-4">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUlLgYZxGn1hvJtDM9QPnXiSeTGHCeJtk",
            authDomain: "number-d4ecd.firebaseapp.com",
            projectId: "number-d4ecd",
            storageBucket: "number-d4ecd.firebasestorage.app",
            messagingSenderId: "304123026188",
            appId: "1:304123026188:web:0ae5e2d2d4939430820729",
            measurementId: "G-6GCPX0LTCL"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (initErr) {
            showGlobalError("Firebase 初始化失敗", initErr.message);
        }

        let todayStr = getTodayString(); 
        let statsRef;

        const adminView = document.getElementById('admin-view');
        const customerView = document.getElementById('ticket-container-view');
        const loadingView = document.getElementById('loading-view');
        
        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        }
        
        function getFormattedDate() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
        }

        function getFormattedTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        const gModal = document.getElementById('global-modal');
        const gModalContainer = document.getElementById('modal-container');
        const gBtnCancel = document.getElementById('modal-btn-cancel');
        const gBtnConfirm = document.getElementById('modal-btn-confirm');
        let modalConfirmAction = null;

        window.showModal = function(title, desc, type = 'info', confirmCallback = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').innerHTML = desc;
            
            const iconEl = document.getElementById('modal-icon');
            if(type === 'error') {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-red-100 text-red-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>';
                gBtnCancel.classList.add('hidden');
                gBtnConfirm.textContent = '我知道了';
            } else if (type === 'confirm') {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
                gBtnCancel.classList.remove('hidden');
                gBtnConfirm.textContent = '確定';
            } else {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-green-100 text-green-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>';
                gBtnCancel.classList.add('hidden');
                gBtnConfirm.textContent = '關閉';
            }

            modalConfirmAction = confirmCallback;
            gModal.classList.remove('opacity-0', 'pointer-events-none');
            gModalContainer.classList.remove('scale-95');
        };

        function hideModal() {
            gModal.classList.add('opacity-0', 'pointer-events-none');
            gModalContainer.classList.add('scale-95');
            modalConfirmAction = null;
        }

        gBtnCancel.addEventListener('click', hideModal);
        gBtnConfirm.addEventListener('click', () => {
            if(modalConfirmAction) modalConfirmAction();
            hideModal();
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    statsRef = doc(db, 'system_tickets', `day_${todayStr}`);
                    const docSnap = await getDoc(statsRef);
                    if (!docSnap.exists()) {
                        await setDoc(statsRef, { issuedCount: 0, redeemedCount: 0, latestRedeemed: 0 });
                    }
                    routeApp();
                } catch (e) {
                    showGlobalError("資料庫路徑設定失敗", e.message);
                }
            } else {
                await signInAnonymously(auth);
            }
        });

        function routeApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            const action = urlParams.get('action');

            if (role === 'admin') {
                initAdminMode();
            } else if (action === 'scan') {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
                initCustomerMode(true);
            } else {
                initCustomerMode(false);
            }
        }

        function initAdminMode() {
            adminView.classList.remove('view-hidden');
            loadingView.classList.add('view-hidden');
            document.getElementById('admin-date').textContent = getFormattedDate();

            if (typeof QRCode === 'undefined') {
                showGlobalError("系統錯誤", "QR Code 模組載入失敗，請檢查網路連線。");
                return;
            }

            const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            const scanUrl = baseUrl + '?action=scan';
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: scanUrl, width: 180, height: 180, colorDark : "#1f2937", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L
            });

            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('admin-issued').textContent = data.issuedCount || 0;
                    document.getElementById('admin-redeemed').textContent = data.redeemedCount || 0;
                }
            });
        }

        window.confirmReset = function() {
            showModal('確認歸零？', '這將會清空今日所有的號碼牌與數據。<br>此操作無法復原，請確認。', 'confirm', async () => {
                try {
                    await setDoc(statsRef, { issuedCount: 0, redeemedCount: 0, latestRedeemed: 0 });
                    showModal('歸零成功', '系統已重置，號碼將從 1 號開始發放。', 'info');
                } catch (error) {
                    showModal('錯誤', '歸零失敗：請確認網路連線與權限。', 'error');
                }
            });
        }

        async function initCustomerMode(isNewScan) {
            const localKey = `myTickets_${todayStr}`;
            let tickets = JSON.parse(localStorage.getItem(localKey)) || [];

            if (isNewScan) {
                if (tickets.length < 3) {
                    try {
                        const newNumber = await fetchNewNumber();
                        tickets.push({
                            number: String(newNumber).padStart(3, '0'),
                            dateStr: getFormattedDate(),
                            timeStr: getFormattedTime(),
                            isRedeemed: false
                        });
                        localStorage.setItem(localKey, JSON.stringify(tickets));
                        
                        loadingView.classList.add('view-hidden');
                        customerView.classList.remove('view-hidden');
                        renderTicketUI(tickets);

                        if(tickets.length === 3) {
                            showModal('領取成功', '您已經抽取了 3 張號碼牌，已達手機領取上限。', 'info');
                        }
                    } catch (error) {
                        showModal('系統忙碌', '抽號發生錯誤，請重新掃描。', 'error');
                    }
                } else {
                    loadingView.classList.add('view-hidden');
                    customerView.classList.remove('view-hidden');
                    showModal('已達上限', '每支手機最多只能抽取 3 張號碼牌喔！', 'error');
                    renderTicketUI(tickets);
                }
            } else {
                if (tickets.length > 0) {
                    loadingView.classList.add('view-hidden');
                    customerView.classList.remove('view-hidden');
                    renderTicketUI(tickets);
                } else {
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('loading-text').classList.add('hidden');
                    document.getElementById('invalid-box').classList.remove('hidden');
                }
            }

            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const currentIssued = data.issuedCount || 0;
                    const latestRedeemed = data.latestRedeemed || 0;

                    document.querySelectorAll('.current-redeemed-display').forEach(el => {
                        el.textContent = String(latestRedeemed).padStart(3, '0');
                    });

                    tickets = JSON.parse(localStorage.getItem(localKey)) || [];
                    let validTickets = tickets.filter(t => parseInt(t.number) <= currentIssued);
                    
                    if (validTickets.length !== tickets.length) {
                        localStorage.setItem(localKey, JSON.stringify(validTickets));
                        if (validTickets.length === 0) {
                            customerView.classList.add('view-hidden');
                            document.getElementById('invalid-box').classList.remove('hidden');
                            showModal('號碼已重置', '店家已清空今日號碼，請重新掃描取號。', 'error');
                        } else {
                            renderTicketUI(validTickets);
                        }
                    }
                }
            });

            if (!window.clockInterval) {
                updateLiveClock();
                window.clockInterval = setInterval(updateLiveClock, 1000);
            }
        }

        async function fetchNewNumber() {
            let newNumber = 0;
            await runTransaction(db, async (transaction) => {
                const docSnap = await transaction.get(statsRef);
                if (!docSnap.exists()) {
                    newNumber = 1;
                    transaction.set(statsRef, { issuedCount: 1, redeemedCount: 0, latestRedeemed: 0 });
                } else {
                    const data = docSnap.data();
                    newNumber = (data.issuedCount || 0) + 1;
                    transaction.update(statsRef, { issuedCount: newNumber });
                }
            });
            return newNumber;
        }

        function renderTicketUI(tickets) {
            customerView.innerHTML = ''; 
            
            tickets.forEach((data, index) => {
                const isRedeemed = data.isRedeemed;
                const btnClass = isRedeemed 
                    ? "w-full py-4 rounded-xl font-bold text-lg text-gray-500 bg-gray-200 pointer-events-none flex justify-center items-center transition-all"
                    : "w-full py-4 rounded-xl font-bold text-lg text-white bg-blue-500 shadow-blue-500/30 shadow-lg hover:bg-blue-600 active:scale-95 flex justify-center items-center transition-all cursor-pointer";
                const btnText = isRedeemed ? "已兌換完畢" : "由工作人員點擊兌換";
                const numberClass = isRedeemed ? "text-gray-300" : "text-gray-800";
                const stampClass = isRedeemed ? "stamp show" : "stamp";

                const ticketHTML = `
                <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden relative mb-6">
                    <div class="bg-gradient-animate text-white text-center py-6 px-4">
                        <h1 class="text-xl font-bold tracking-wider">專屬號碼牌 ${tickets.length > 1 ? `(${index + 1}/${tickets.length})` : ''}</h1>
                        <p class="text-sm opacity-90 mt-1">憑此畫面至櫃台兌換</p>
                    </div>

                    <div class="p-6 text-center relative overflow-hidden">
                        <div class="${stampClass}">已兌換</div>
                        <p class="text-gray-500 text-sm font-medium mb-1">您的專屬號碼</p>
                        <div class="flex items-center justify-center mb-5">
                            <span class="text-2xl font-bold text-gray-400 mr-2">No.</span>
                            <span class="text-7xl font-black tracking-tighter ${numberClass}">${data.number}</span>
                        </div>
                        
                        <div class="flex items-center justify-center mb-6">
                            <div class="bg-blue-50 px-4 py-2 rounded-full border border-blue-100 flex items-center shadow-sm">
                                <span class="text-sm text-gray-600 font-medium mr-1">目前已叫號至：</span>
                                <span class="text-lg font-bold text-blue-600">No.<span class="current-redeemed-display">---</span></span>
                            </div>
                        </div>

                        <div class="flex flex-col space-y-2 bg-gray-50 py-3 px-4 rounded-xl border border-gray-100">
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-gray-400">取得日期</span>
                                <span class="font-bold text-gray-700">${data.dateStr}</span>
                            </div>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-gray-400">取得時間</span>
                                <span class="font-bold text-gray-700">${data.timeStr}</span>
                            </div>
                        </div>

                        <div class="mt-4 w-full text-center bg-green-50 py-2 rounded-lg border border-green-100 flex items-center justify-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-green-500 blink-dot"></div>
                            <span class="text-xs text-green-700 font-medium">即時防偽驗證</span>
                            <span class="live-clock-el text-sm font-mono font-bold text-green-800 tracking-wider">--:--:--</span>
                        </div>
                    </div>

                    <div class="ticket-divider h-8 relative flex items-center">
                        <div class="w-full border-t-2 border-dashed border-gray-200 mx-4"></div>
                    </div>

                    <div class="p-6 pt-2 pb-8">
                        <button id="btn-${index}" class="${btnClass}">
                            <span>${btnText}</span>
                        </button>
                        <p class="text-xs text-center text-red-500 mt-4 font-bold">⚠️ 提醒：請交由工作人員點擊兌換</p>
                    </div>
                </div>`;
                customerView.insertAdjacentHTML('beforeend', ticketHTML);
            });

            tickets.forEach((data, index) => {
                if (!data.isRedeemed) {
                    document.getElementById(`btn-${index}`).onclick = () => {
                        showModal('確認兌換？', `即將兌換 <b>No.${data.number}</b><br>點擊後將無法還原，請確認。`, 'confirm', () => executeRedeem(index));
                    };
                }
            });

            updateLiveClock();
        }

        window.executeRedeem = async function(index) {
            const localKey = `myTickets_${todayStr}`;
            let tickets = JSON.parse(localStorage.getItem(localKey)) || [];
            
            if (tickets[index] && !tickets[index].isRedeemed) {
                try {
                    await runTransaction(db, async (transaction) => {
                        const docSnap = await transaction.get(statsRef);
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            const currentRedeemedCount = data.redeemedCount || 0;
                            const currentLatest = data.latestRedeemed || 0;
                            const myNumber = parseInt(tickets[index].number);
                            
                            transaction.update(statsRef, { 
                                redeemedCount: currentRedeemedCount + 1,
                                latestRedeemed: Math.max(currentLatest, myNumber)
                            });
                        }
                    });

                    tickets[index].isRedeemed = true;
                    localStorage.setItem(localKey, JSON.stringify(tickets));
                    renderTicketUI(tickets);

                } catch(e) {
                    showModal('錯誤', '兌換失敗，請確認網路連線。', 'error');
                }
            }
        }

        function updateLiveClock() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2,'0') + ":" + 
                            String(now.getMinutes()).padStart(2,'0') + ":" + 
                            String(now.getSeconds()).padStart(2,'0');
            document.querySelectorAll('.live-clock-el').forEach(el => el.textContent = timeStr);
        }
    </script>
</body>
</html>
