<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲端號碼牌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- QR Code 生成套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .view-hidden { display: none !important; }
        
        /* 票券的半圓形切角設計 */
        .ticket-divider { position: relative; }
        .ticket-divider::before, .ticket-divider::after {
            content: ''; position: absolute; top: 50%; width: 24px; height: 24px;
            background-color: #f3f4f6; border-radius: 50%;
            transform: translateY(-50%); box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }
        .ticket-divider::before { left: -12px; }
        .ticket-divider::after { right: -12px; }

        /* 已兌換的印章效果 */
        .stamp {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg) scale(0);
            border: 4px solid #ef4444; color: #ef4444;
            font-size: 2rem; font-weight: 900; padding: 0.5rem 2rem;
            border-radius: 0.5rem; opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 10;
        }
        .stamp.show { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.9; }

        /* 漸變背景動畫 */
        .bg-gradient-animate {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- 全域客製化彈窗 (取代 alert/confirm) -->
    <div id="global-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-300" id="modal-container">
            <div id="modal-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500">
                <!-- Icon 視情況替換 -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2">標題</h3>
            <p id="modal-desc" class="text-gray-500 text-sm mb-6">內容描述</p>
            <div id="modal-buttons" class="flex space-x-3">
                <button id="modal-btn-cancel" class="flex-1 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 active:bg-gray-200 transition-colors hidden">取消</button>
                <button id="modal-btn-confirm" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-500 active:bg-blue-600 shadow-md transition-colors">確定</button>
            </div>
        </div>
    </div>

    <!-- 載入中 / 無效連結畫面 -->
    <div id="loading-view" class="w-full max-w-sm text-center">
        <div id="loading-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
        <p id="loading-text" class="text-gray-600 font-medium">系統連線中，請稍候...</p>
        
        <!-- 當不是合法路由時顯示的錯誤區塊 -->
        <div id="invalid-box" class="hidden bg-white p-8 rounded-2xl shadow-lg mt-4">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">無效的連結</h2>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">請親自至現場櫃台掃描 QR Code 領取號碼牌。<br>此網址無法透過轉傳分享給他人。</p>
        </div>
    </div>

    <!-- 店家管理主控台 (網址需加上 ?role=admin 才會顯示) -->
    <div id="admin-view" class="w-full max-w-md bg-gray-900 rounded-2xl shadow-2xl overflow-hidden view-hidden border border-gray-700">
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-white font-bold text-lg flex items-center">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse mr-2"></span>
                發號主控台
            </h1>
            <span id="admin-date" class="text-gray-400 text-sm">--/--/--</span>
        </div>
        
        <div class="p-6 text-center">
            <p class="text-gray-400 text-sm mb-4">請讓顧客掃描此 QR Code 抽取號碼</p>
            <div class="bg-white p-4 rounded-xl inline-block mb-6 shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                <div id="qrcode" class="w-48 h-48 flex items-center justify-center">
                    <!-- QR Code 將由 JS 產生 -->
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">今日已發出</p>
                    <p class="text-3xl font-bold text-blue-400" id="admin-issued">0</p>
                </div>
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">今日已兌換</p>
                    <p class="text-3xl font-bold text-green-400" id="admin-redeemed">0</p>
                </div>
            </div>

            <button onclick="confirmReset()" class="w-full py-3 mt-2 rounded-xl text-sm font-bold text-red-400 bg-red-400/10 border border-red-400/30 hover:bg-red-400/20 transition-colors">
                ⚠️ 清除今日所有紀錄 (重新發放)
            </button>
        </div>
    </div>

    <!-- 顧客號碼牌介面 -->
    <main id="customer-view" class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden relative view-hidden">
        <div class="bg-gradient-animate text-white text-center py-6 px-4">
            <h1 class="text-xl font-bold tracking-wider">現場排隊號碼牌</h1>
            <p class="text-sm opacity-90 mt-1">憑此畫面至櫃台兌換服務</p>
        </div>

        <div class="p-6 text-center relative overflow-hidden">
            <div id="redeemed-stamp" class="stamp">已兌換</div>
            
            <p class="text-gray-500 text-sm font-medium mb-1">您的專屬號碼</p>
            <div class="flex items-center justify-center mb-5">
                <span class="text-2xl font-bold text-gray-400 mr-2">No.</span>
                <span id="ticket-number" class="text-7xl font-black text-gray-800 tracking-tighter">---</span>
            </div>

            <!-- 全新功能：即時兌換進度顯示區塊 -->
            <div class="flex items-center justify-center mb-6">
                <div class="bg-blue-50 px-4 py-2 rounded-full border border-blue-100 flex items-center shadow-sm">
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse mr-2"></div>
                    <span class="text-sm text-gray-600 font-medium mr-1">目前已兌換至：</span>
                    <span class="text-lg font-bold text-blue-600">No.<span id="current-redeemed-display">---</span></span>
                </div>
            </div>
            
            <div class="flex flex-col space-y-2 bg-gray-50 py-3 px-4 rounded-xl border border-gray-100">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">取得日期</span>
                    <span id="ticket-date" class="font-bold text-gray-700">--/--/--</span>
                </div>
                <div class="flex justify-between items-center text-sm">
                    <span class="text-gray-400">取得時間</span>
                    <span id="ticket-time" class="font-bold text-gray-700">--:--</span>
                </div>
            </div>

            <!-- 防偽跳動時鐘 -->
            <div class="mt-4 w-full text-center bg-gray-50 py-2 rounded-lg border border-gray-100 flex items-center justify-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs text-gray-500">即時防偽驗證</span>
                <span id="live-clock" class="text-sm font-mono font-bold text-gray-700 tracking-wider">--:--:--</span>
            </div>
        </div>

        <div class="ticket-divider h-8 relative flex items-center">
            <div class="w-full border-t-2 border-dashed border-gray-200 mx-4"></div>
        </div>

        <div class="p-6 pt-2 pb-8">
            <button id="btn-redeem" class="w-full py-4 rounded-xl font-bold text-lg text-white shadow-lg transition-all transform flex justify-center items-center pointer-events-none bg-gray-300">
                讀取中...
            </button>
            <p class="text-xs text-center text-red-400 mt-4 font-medium">⚠️ 提醒：請務必交由工作人員點擊兌換</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDocs, collection, deleteDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 您的專屬 Firebase Config 
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAUlLgYZxGn1hvJtDM9QPnXiSeTGHCeJtk",
            authDomain: "number-d4ecd.firebaseapp.com",
            projectId: "number-d4ecd",
            storageBucket: "number-d4ecd.firebasestorage.app",
            messagingSenderId: "304123026188",
            appId: "1:304123026188:web:0ae5e2d2d4939430820729"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 核心變數
        const appId = 'ticket_system'; // 用於架構資料庫路徑
        let currentUserId = null;
        let todayStr = getTodayString(); 
        
        // 資料庫參考路徑
        let statsRef, ticketsColRef;

        // DOM 元素
        const adminView = document.getElementById('admin-view');
        const customerView = document.getElementById('customer-view');
        const loadingView = document.getElementById('loading-view');
        
        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        }
        
        function getFormattedDate() {
            const now = new Date();
            return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
        }

        function getFormattedTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        // --- 客製化彈窗邏輯 ---
        const gModal = document.getElementById('global-modal');
        const gModalContainer = document.getElementById('modal-container');
        const gBtnCancel = document.getElementById('modal-btn-cancel');
        const gBtnConfirm = document.getElementById('modal-btn-confirm');
        let modalConfirmAction = null;

        window.showModal = function(title, desc, type = 'info', confirmCallback = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').innerHTML = desc;
            
            const iconEl = document.getElementById('modal-icon');
            if(type === 'error') {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-red-100 text-red-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>';
                gBtnCancel.classList.add('hidden');
            } else if (type === 'confirm') {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
                gBtnCancel.classList.remove('hidden');
            } else {
                iconEl.className = 'w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-green-100 text-green-500';
                iconEl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>';
                gBtnCancel.classList.add('hidden');
            }

            modalConfirmAction = confirmCallback;
            gModal.classList.remove('opacity-0', 'pointer-events-none');
            gModalContainer.classList.remove('scale-95');
        };

        function hideModal() {
            gModal.classList.add('opacity-0', 'pointer-events-none');
            gModalContainer.classList.add('scale-95');
            modalConfirmAction = null;
        }

        gBtnCancel.addEventListener('click', hideModal);
        gBtnConfirm.addEventListener('click', () => {
            if(modalConfirmAction) modalConfirmAction();
            hideModal();
        });

        // ==========================================
        // 系統啟動與路由判斷
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                // 設定資料庫路徑 (強制遵守 Mandatory Rule)
                statsRef = doc(db, 'artifacts', appId, 'public', 'data', `stats_${todayStr}`);
                ticketsColRef = collection(db, 'artifacts', appId, 'public', 'data', `tickets_${todayStr}`);
                
                routeApp();
            } else {
                signInAnonymously(auth).catch((error) => {
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('loading-text').innerHTML = `<span class="text-red-500 font-bold">資料庫連線失敗</span><br><span class="text-xs text-gray-400">${error.message}</span>`;
                });
            }
        });

        function routeApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            const action = urlParams.get('action');

            if (role === 'admin') {
                // 店家主控台模式
                initAdminMode();
            } else if (action === 'scan') {
                // 客人掃描 QR Code 取號模式
                // ！！！防外流關鍵：瞬間清空網址！！！
                window.history.replaceState(null, null, window.location.pathname);
                initCustomerMode(true);
            } else {
                // 乾淨網址進入 (可能是不小心重整，或是朋友轉傳的網址)
                initCustomerMode(false);
            }
        }

        // ==========================================
        // 店家主控台邏輯
        // ==========================================
        function initAdminMode() {
            adminView.classList.remove('view-hidden');
            loadingView.classList.add('view-hidden');
            document.getElementById('admin-date').textContent = getFormattedDate();

            // 產生專屬 QR Code (帶有 ?action=scan)
            const scanUrl = window.location.origin + window.location.pathname + '?action=scan';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: scanUrl,
                width: 192,
                height: 192,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.L
            });

            // 監聽當日發放進度
            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('admin-issued').textContent = data.issuedCount || 0;
                    document.getElementById('admin-redeemed').textContent = data.redeemedCount || 0;
                } else {
                    document.getElementById('admin-issued').textContent = 0;
                    document.getElementById('admin-redeemed').textContent = 0;
                }
            });
        }

        // 綁定全域函數供 HTML 按鈕呼叫
        window.confirmReset = function() {
            showModal('確認歸零？', '這將會清空今日所有的號碼牌與數據。<br>此操作無法復原，請確認。', 'confirm', async () => {
                try {
                    // 1. 重設統計數據
                    await setDoc(statsRef, { issuedCount: 0, redeemedCount: 0 });
                    // 2. 刪除所有當日票券 (讓客人畫面同步顯示失效)
                    const querySnapshot = await getDocs(ticketsColRef);
                    querySnapshot.forEach((docSnap) => {
                        deleteDoc(docSnap.ref);
                    });
                    showModal('歸零成功', '系統已重置，號碼將從 1 號開始。', 'info');
                } catch (error) {
                    showModal('錯誤', '歸零失敗：' + error.message, 'error');
                }
            });
        }

        // ==========================================
        // 顧客號碼牌邏輯
        // ==========================================
        async function initCustomerMode(canDrawNew) {
            const myTicketRef = doc(ticketsColRef, currentUserId);
            
            // 檢查 LocalStorage 是否有今日紀錄
            const savedData = localStorage.getItem(`ticket_${todayStr}`);
            
            if (!savedData && !canDrawNew) {
                // 沒有紀錄，也不是掃描進來的 (代表是點別人分享的網址)
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('loading-text').classList.add('hidden');
                document.getElementById('invalid-box').classList.remove('hidden');
                return;
            }

            if (!savedData && canDrawNew) {
                // 掃描進來，且沒有紀錄 -> 執行雲端抽號 (使用 Transaction 防併發重號)
                try {
                    await runTransaction(db, async (transaction) => {
                        const statsDoc = await transaction.get(statsRef);
                        let newNumber = 1;
                        if (!statsDoc.exists()) {
                            transaction.set(statsRef, { issuedCount: 1, redeemedCount: 0 });
                        } else {
                            newNumber = (statsDoc.data().issuedCount || 0) + 1;
                            transaction.update(statsRef, { issuedCount: newNumber });
                        }
                        
                        transaction.set(myTicketRef, {
                            number: String(newNumber).padStart(3, '0'),
                            dateStr: getFormattedDate(),
                            timeStr: getFormattedTime(),
                            timestamp: serverTimestamp(),
                            isRedeemed: false
                        });
                    });
                    // 抽號成功，紀錄在手機
                    localStorage.setItem(`ticket_${todayStr}`, "exist");
                } catch (error) {
                    console.error("Transaction failed:", error);
                    showModal('系統忙碌', '請重新掃描 QR Code 試試看', 'error');
                    return;
                }
            }

            // 切換畫面
            loadingView.classList.add('view-hidden');
            customerView.classList.remove('view-hidden');

            // 【新功能】監聽整體系統兌換進度
            onSnapshot(statsRef, (docSnap) => {
                const displayEl = document.getElementById('current-redeemed-display');
                if (docSnap.exists()) {
                    const redeemed = docSnap.data().redeemedCount || 0;
                    displayEl.textContent = String(redeemed).padStart(3, '0');
                } else {
                    displayEl.textContent = "000";
                }
            });

            // 監聽我的專屬票券狀態
            onSnapshot(myTicketRef, (docSnap) => {
                if (docSnap.exists()) {
                    renderTicketUI(docSnap.data());
                } else {
                    // 號碼牌在雲端被刪除 (通常是店家按了歸零)
                    localStorage.removeItem(`ticket_${todayStr}`);
                    showModal('號碼已重置', '店家已清空今日號碼，請重新掃描 QR Code 取號。', 'error', () => {
                        window.location.reload();
                    });
                }
            });

            // 啟動防截圖跳動時鐘
            setInterval(updateLiveClock, 1000);
            updateLiveClock();

            // 綁定兌換按鈕
            const btnRedeem = document.getElementById('btn-redeem');
            btnRedeem.addEventListener('click', () => {
                showModal('確認兌換？', '點擊後將無法還原，<br>請確認是否交由工作人員操作。', 'confirm', async () => {
                    try {
                        // 使用 Transaction 確保兌換統計正確
                        await runTransaction(db, async (transaction) => {
                            const ticketDoc = await transaction.get(myTicketRef);
                            if(!ticketDoc.exists() || ticketDoc.data().isRedeemed) return; // 已經兌換過了

                            const statsDoc = await transaction.get(statsRef);
                            if(statsDoc.exists()) {
                                const newRedeemed = (statsDoc.data().redeemedCount || 0) + 1;
                                transaction.update(statsRef, { redeemedCount: newRedeemed });
                            }
                            transaction.update(myTicketRef, { isRedeemed: true });
                        });
                    } catch (err) {
                        showModal('錯誤', '兌換失敗，請稍後再試', 'error');
                    }
                });
            });
        }

        function renderTicketUI(data) {
            document.getElementById('ticket-number').textContent = data.number;
            document.getElementById('ticket-date').textContent = data.dateStr;
            document.getElementById('ticket-time').textContent = data.timeStr;
            
            const btnRedeem = document.getElementById('btn-redeem');
            const stamp = document.getElementById('redeemed-stamp');
            const numText = document.getElementById('ticket-number');

            if (data.isRedeemed) {
                btnRedeem.className = "w-full py-4 rounded-xl font-bold text-lg text-gray-500 bg-gray-200 pointer-events-none flex justify-center items-center transition-all";
                btnRedeem.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>已兌換完畢`;
                numText.classList.add('text-gray-300');
                stamp.classList.add('show');
            } else {
                btnRedeem.className = "w-full py-4 rounded-xl font-bold text-lg text-white bg-blue-500 shadow-blue-500/30 shadow-lg hover:bg-blue-600 active:scale-95 flex justify-center items-center transition-all cursor-pointer";
                btnRedeem.textContent = "立即兌換";
                numText.classList.remove('text-gray-300');
                stamp.classList.remove('show');
            }
        }

        function updateLiveClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('live-clock');
            if(clockEl) clockEl.textContent = `${hh}:${mm}:${ss}`;
        }
    </script>
</body>
</html>
