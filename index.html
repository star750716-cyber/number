<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專屬號碼牌系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .view-hidden { display: none !important; }

        .ticket-divider { position: relative; }
        .ticket-divider::before, .ticket-divider::after {
            content: ''; position: absolute; top: 50%; width: 24px; height: 24px; background-color: #f3f4f6;
            border-radius: 50%; transform: translateY(-50%); box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }
        .ticket-divider::before { left: -12px; }
        .ticket-divider::after { right: -12px; }

        .stamp {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg) scale(0);
            border: 4px solid #ef4444; color: #ef4444; font-size: 2rem; font-weight: 900; padding: 0.5rem 2rem;
            border-radius: 0.5rem; opacity: 0; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 10;
        }
        .stamp.show { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.9; }

        .bg-gradient-animate {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); background-size: 200% 200%; animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .blink-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
    <script>
        function showGlobalError(title, detail) {
            const spinner = document.getElementById('loading-spinner');
            const text = document.getElementById('loading-text');
            if(spinner) spinner.style.display = 'none';
            if(text) {
                text.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-lg border border-red-100 max-w-sm mx-auto mt-4 text-left">
                        <div class="flex items-center text-red-500 mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                            <span class="font-bold text-lg">${title}</span>
                        </div>
                        <p class="text-xs text-gray-500 break-words mb-4">${detail}</p>
                        <button onclick="window.location.reload()" class="w-full py-3 bg-red-50 text-red-600 rounded-lg text-sm font-bold hover:bg-red-100 active:scale-95 transition-all">重新整理網頁</button>
                    </div>`;
            }
        }
        window.addEventListener('error', function(event) {
            showGlobalError('程式碼執行錯誤', event.message);
        });
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.code === 'auth/unauthorized-domain') {
                showGlobalError("網域未授權 (Firebase)", "請至 Firebase 控制台 > Authentication > Settings > 授權網域，新增 star750716-cyber.github.io");
            } else {
                showGlobalError('資料庫連線失敗', event.reason);
            }
        });
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <div id="loading-view" class="w-full max-w-sm text-center">
        <div id="loading-spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
        <div id="loading-text" class="text-gray-600 font-medium">系統連線中，請稍候...</div>
        
        <div id="invalid-box" class="hidden bg-white p-8 rounded-2xl shadow-lg mt-4">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">無效的連結</h2>
            <p class="text-gray-500 text-sm mb-6 leading-relaxed">請親自至現場掃描 QR Code 取號。</p>
        </div>
    </div>

    <div id="admin-view" class="w-full max-w-md bg-gray-900 rounded-2xl shadow-2xl overflow-hidden view-hidden border border-gray-700">
        <div class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
            <h1 class="text-white font-bold text-lg flex items-center">發號主控台</h1>
            <span id="admin-date" class="text-gray-400 text-sm font-mono">--/--/--</span>
        </div>
        <div class="p-6 text-center">
            <p class="text-gray-400 text-sm mb-4">請顧客掃描此 QR Code</p>
            <div class="bg-white p-4 rounded-xl inline-block mb-6"><div id="qrcode"></div></div>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">今日已發出</p>
                    <p class="text-3xl font-bold text-blue-400" id="admin-issued">0</p>
                </div>
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <p class="text-gray-400 text-xs mb-1">已完成兌換</p>
                    <p class="text-3xl font-bold text-green-400" id="admin-redeemed">0</p>
                </div>
            </div>
            <button onclick="confirmReset()" class="w-full py-3 rounded-xl text-sm font-bold text-red-400 bg-red-400/10 border border-red-400/30">清除今日數據並歸零</button>
        </div>
    </div>

    <div id="ticket-container-view" class="w-full flex flex-col items-center view-hidden pb-8 pt-4"></div>

    <div id="global-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-300" id="modal-container">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2"></h3>
            <p id="modal-desc" class="text-gray-500 text-sm mb-6"></p>
            <div id="modal-buttons" class="flex space-x-3">
                <button id="modal-btn-cancel" class="flex-1 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hidden">取消</button>
                <button id="modal-btn-confirm" class="flex-1 py-3 rounded-xl font-bold text-white bg-blue-500">確定</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUlLgYZxGn1hvJtDM9QPnXiSeTGHCeJtk",
            authDomain: "number-d4ecd.firebaseapp.com",
            projectId: "number-d4ecd",
            storageBucket: "number-d4ecd.firebasestorage.app",
            messagingSenderId: "304123026188",
            appId: "1:304123026188:web:0ae5e2d2d4939430820729",
            measurementId: "G-6GCPX0LTCL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let todayStr = getTodayString(); 
        let statsRef;

        const adminView = document.getElementById('admin-view');
        const customerView = document.getElementById('ticket-container-view');
        const loadingView = document.getElementById('loading-view');
        
        function getTodayString() {
            const now = new Date(); return `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        }
        function getFormattedDate() {
            const now = new Date(); return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
        }
        function getFormattedTime() {
            const now = new Date(); return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        const gModal = document.getElementById('global-modal');
        const gModalContainer = document.getElementById('modal-container');
        const gBtnCancel = document.getElementById('modal-btn-cancel');
        const gBtnConfirm = document.getElementById('modal-btn-confirm');
        let modalConfirmAction = null;

        window.showModal = function(title, desc, type = 'info', confirmCallback = null) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').innerHTML = desc;
            if (type === 'confirm') {
                gBtnCancel.classList.remove('hidden');
                gBtnConfirm.textContent = '確定';
            } else {
                gBtnCancel.classList.add('hidden');
                gBtnConfirm.textContent = '關閉';
            }
            modalConfirmAction = confirmCallback;
            gModal.classList.remove('opacity-0', 'pointer-events-none');
            gModalContainer.classList.remove('scale-95');
        };

        gBtnCancel.onclick = () => { gModal.classList.add('opacity-0', 'pointer-events-none'); gModalContainer.classList.add('scale-95'); };
        gBtnConfirm.onclick = () => { if(modalConfirmAction) modalConfirmAction(); gBtnCancel.onclick(); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                statsRef = doc(db, 'system_tickets', `day_${todayStr}`);
                const docSnap = await getDoc(statsRef);
                if (!docSnap.exists()) await setDoc(statsRef, { issuedCount: 0, redeemedCount: 0, latestRedeemed: 0 });
                routeApp();
            } else {
                await signInAnonymously(auth);
            }
        });

        function routeApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            const action = urlParams.get('action');

            if (role === 'admin') {
                initAdminMode();
            } else if (action === 'scan') {
                window.history.replaceState({}, document.title, window.location.pathname);
                initCustomerMode(true);
            } else {
                initCustomerMode(false);
            }
        }

        function initAdminMode() {
            adminView.classList.remove('view-hidden');
            loadingView.classList.add('view-hidden');
            document.getElementById('admin-date').textContent = getFormattedDate();

            const scanUrl = window.location.origin + window.location.pathname + '?action=scan';
            new QRCode(document.getElementById("qrcode"), { text: scanUrl, width: 180, height: 180, correctLevel : QRCode.CorrectLevel.L });

            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('admin-issued').textContent = data.issuedCount || 0;
                    document.getElementById('admin-redeemed').textContent = data.redeemedCount || 0;
                }
            });
        }

        window.confirmReset = function() {
            showModal('確認歸零？', '這將會清空今日數據。', 'confirm', async () => {
                await setDoc(statsRef, { issuedCount: 0, redeemedCount: 0, latestRedeemed: 0 });
                showModal('成功', '號碼已重置。', 'info');
            });
        }

        async function initCustomerMode(isNewScan) {
            const localKey = `myTickets_${todayStr}`;
            let tickets = JSON.parse(localStorage.getItem(localKey)) || [];

            if (isNewScan) {
                if (tickets.length < 3) {
                    loadingView.classList.remove('view-hidden');
                    try {
                        let newNumber = 0;
                        await runTransaction(db, async (transaction) => {
                            const docSnap = await transaction.get(statsRef);
                            const data = docSnap.exists() ? docSnap.data() : { issuedCount: 0, redeemedCount: 0, latestRedeemed: 0 };
                            newNumber = (data.issuedCount || 0) + 1;
                            if(!docSnap.exists()) transaction.set(statsRef, { issuedCount: newNumber, redeemedCount: 0, latestRedeemed: 0 });
                            else transaction.update(statsRef, { issuedCount: newNumber });
                        });
                        tickets.push({ number: String(newNumber).padStart(3, '0'), dateStr: getFormattedDate(), timeStr: getFormattedTime(), isRedeemed: false });
                        localStorage.setItem(localKey, JSON.stringify(tickets));
                        loadingView.classList.add('view-hidden');
                        customerView.classList.remove('view-hidden');
                        renderTicketUI(tickets);
                    } catch (error) {
                        showModal('錯誤', '系統忙碌。', 'error');
                    }
                } else {
                    loadingView.classList.add('view-hidden');
                    customerView.classList.remove('view-hidden');
                    renderTicketUI(tickets);
                }
            } else {
                if (tickets.length > 0) {
                    loadingView.classList.add('view-hidden');
                    customerView.classList.remove('view-hidden');
                    renderTicketUI(tickets);
                } else {
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('loading-text').classList.add('hidden');
                    document.getElementById('invalid-box').classList.remove('hidden');
                }
            }

            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.querySelectorAll('.current-redeemed-display').forEach(el => el.textContent = String(data.latestRedeemed || 0).padStart(3, '0'));
                    
                    tickets = JSON.parse(localStorage.getItem(localKey)) || [];
                    let validTickets = tickets.filter(t => parseInt(t.number) <= (data.issuedCount || 0));
                    if (validTickets.length !== tickets.length) {
                        localStorage.setItem(localKey, JSON.stringify(validTickets));
                        if (validTickets.length === 0) {
                            customerView.classList.add('view-hidden');
                            document.getElementById('invalid-box').classList.remove('hidden');
                        } else {
                            renderTicketUI(validTickets);
                        }
                    }
                }
            });

            if (!window.clockInterval) {
                updateLiveClock(); window.clockInterval = setInterval(updateLiveClock, 1000);
            }
        }

        function renderTicketUI(tickets) {
            customerView.innerHTML = ''; 
            tickets.forEach((data, index) => {
                const isRedeemed = data.isRedeemed;
                const btnClass = isRedeemed ? "w-full py-4 rounded-xl font-bold text-lg text-gray-500 bg-gray-200 pointer-events-none" : "w-full py-4 rounded-xl font-bold text-lg text-white bg-blue-500 shadow-lg";
                const btnText = isRedeemed ? "已兌換" : "點擊兌換";
                const numberClass = isRedeemed ? "text-gray-300" : "text-gray-800";
                
                const ticketHTML = `
                <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden relative mb-6">
                    <div class="bg-gradient-animate text-white text-center py-6 px-4">
                        <h1 class="text-xl font-bold">專屬號碼牌 ${tickets.length > 1 ? `(${index + 1}/${tickets.length})` : ''}</h1>
                    </div>
                    <div class="p-6 text-center relative">
                        <div class="stamp ${isRedeemed ? 'show' : ''}">已兌換</div>
                        <p class="text-gray-500 text-sm mb-1">您的專屬號碼</p>
                        <div class="text-7xl font-black ${numberClass} mb-5">${data.number}</div>
                        <div class="bg-blue-50 px-4 py-2 rounded-full mb-6 text-sm text-blue-600 font-bold">已叫號至：No.<span class="current-redeemed-display">---</span></div>
                        <div class="flex flex-col bg-gray-50 py-3 px-4 rounded-xl text-sm">
                            <div class="flex justify-between"><span class="text-gray-400">日期</span><span class="font-bold">${data.dateStr}</span></div>
                            <div class="flex justify-between"><span class="text-gray-400">時間</span><span class="font-bold">${data.timeStr}</span></div>
                        </div>
                        <div class="mt-4 text-center bg-green-50 py-2 rounded-lg text-xs text-green-700 flex items-center justify-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-green-500 blink-dot"></div><span>即時防偽驗證</span><span class="live-clock-el font-mono font-bold">--:--:--</span>
                        </div>
                    </div>
                    <div class="p-6 pt-0">
                        <button id="btn-${index}" class="${btnClass}">${btnText}</button>
                    </div>
                </div>`;
                customerView.insertAdjacentHTML('beforeend', ticketHTML);
            });

            tickets.forEach((data, index) => {
                if (!data.isRedeemed) {
                    document.getElementById(`btn-${index}`).onclick = () => {
                        showModal('確認兌換？', `即將兌換 <b>No.${data.number}</b>`, 'confirm', () => executeRedeem(index));
                    };
                }
            });
            updateLiveClock();
        }

        window.executeRedeem = async function(index) {
            const localKey = `myTickets_${todayStr}`;
            let tickets = JSON.parse(localStorage.getItem(localKey)) || [];
            if (tickets[index] && !tickets[index].isRedeemed) {
                try {
                    await runTransaction(db, async (transaction) => {
                        const docSnap = await transaction.get(statsRef);
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            transaction.update(statsRef, { 
                                redeemedCount: (data.redeemedCount || 0) + 1,
                                latestRedeemed: Math.max((data.latestRedeemed || 0), parseInt(tickets[index].number))
                            });
                        }
                    });
                    tickets[index].isRedeemed = true;
                    localStorage.setItem(localKey, JSON.stringify(tickets));
                    renderTicketUI(tickets);
                } catch(e) { }
            }
        }

        function updateLiveClock() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0') + ":" + String(now.getSeconds()).padStart(2,'0');
            document.querySelectorAll('.live-clock-el').forEach(el => el.textContent = timeStr);
        }
    </script>
</body>
</html>
